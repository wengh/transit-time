[workspace]
members = ["transit-data", "transit-prep", "transit-router", "transit-router-wasm"]
resolver = "2"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "z"
lto = "fat"
