[package]
name = "city-builder"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "city-builder"
path = "src/main.rs"

[dependencies]
transit-prep = { path = "../transit-prep" }
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", features = ["blocking", "json"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
jsonc-parser = { version = "0.32.2", features = ["serde"] }
dotenvy = "0.15"
chrono = "0.4"
rayon = "1"
sha1 = "0.10"
