name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
  schedule:
    # Fires daily; the `gate` job lets the pipeline through every
    # REBUILD_EVERY_DAYS days (see below). Cron can't express "every N days"
    # directly (`*/6` resets at month boundaries).
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Only one deployment at a time; a new push cancels an in-flight run
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  # Decide whether a scheduled run does anything. Pushes and manual runs
  # always build. Scheduled runs build every REBUILD_EVERY_DAYS days, counted
  # in whole days since the Unix epoch so the spacing is exact across month
  # and year boundaries.
  #
  # Keep REBUILD_EVERY_DAYS < 7: GitHub evicts Actions caches not accessed
  # for 7 days, and the build is what touches them. A weekly cron raced that
  # deadline by seconds and lost (the downloads and cargo caches were both
  # evicted on 2026-08-23).
  gate:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - id: decide
        env:
          REBUILD_EVERY_DAYS: 6
        run: |
          if [ "$GITHUB_EVENT_NAME" != "schedule" ] \
             || [ $(( $(date +%s) / 86400 % REBUILD_EVERY_DAYS )) -eq 0 ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false (next in $(( REBUILD_EVERY_DAYS - $(date +%s) / 86400 % REBUILD_EVERY_DAYS )) day(s))"
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: gate
    if: needs.gate.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── Rust toolchain ─────────────────────────────────────────────────────
      # llvm-tools-preview ships llvm-profdata, required by `make wasm-pgo`
      # to merge .profraw output from the native PGO training run.
      - name: Install Rust nightly
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
          components: rust-src, llvm-tools-preview

      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Cache Cargo registry + build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # ── Data (.bin files) ──────────────────────────────────────────────────
      # Built before WASM because `make wasm-pgo` trains a native profile
      # against transit-viz/public/data/chicago.bin.
      #
      # Cache layers:
      #   1. sha1 sidecars (tiny, always restored — used to check feed freshness)
      #   2. raw GTFS/OSM downloads (large). Always restored, even on weeks with
      #      no rebuild: GitHub evicts caches untouched for 7 days, and a lost
      #      download cache means an upstream outage (e.g. Interline serving
      #      404s) has nothing to fall back to. Saved under a per-run key after
      #      every rebuild — including failed ones — so refreshed extracts and
      #      "last confirmed" sidecar stamps persist.
      #   3. compiled .bin files (fast to restore, avoid full rebuild)

      - name: Cache feed version hashes
        uses: actions/cache@v4
        with:
          path: cache/sha1/
          key: ${{ runner.os }}-sha1-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-sha1-

      # `cache/sha1/` is excluded: it's restored above from a newer snapshot,
      # and an overlapping restore would overwrite it.
      - name: Restore raw GTFS/OSM downloads
        uses: actions/cache/restore@v4
        with:
          path: |
            cache/
            !cache/sha1/
          key: ${{ runner.os }}-downloads-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-downloads-

      - name: Cache compiled .bin files
        uses: actions/cache@v4
        with:
          path: transit-viz/public/data/
          key: ${{ runner.os }}-bins-${{ hashFiles('transit-prep/src/**', 'transit-router/src/**', 'city-builder/src/**', 'cities/*.jsonc') }}-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-bins-${{ hashFiles('transit-prep/src/**', 'transit-router/src/**', 'city-builder/src/**', 'cities/*.jsonc') }}-

      - name: Check if rebuild needed
        id: check-feeds
        env:
          TRANSITLAND_API_KEY: ${{ secrets.TRANSITLAND_API_KEY }}
          INTERLINE_OSM_EXTRACTS_API_KEY: ${{ secrets.INTERLINE_OSM_EXTRACTS_API_KEY }}
        run: |
          cargo build --release -p city-builder
          if cargo run --release -p city-builder -- pipeline --check-only \
              --cities-dir cities/ --output-dir transit-viz/public/data/ --cache-dir cache; then
            echo "needs_rebuild=false" >> "$GITHUB_OUTPUT"
          else
            echo "needs_rebuild=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build data
        if: steps.check-feeds.outputs.needs_rebuild == 'true'
        env:
          TRANSITLAND_API_KEY: ${{ secrets.TRANSITLAND_API_KEY }}
          INTERLINE_OSM_EXTRACTS_API_KEY: ${{ secrets.INTERLINE_OSM_EXTRACTS_API_KEY }}
        run: make data-all

      - name: Save raw GTFS/OSM downloads
        uses: actions/cache/save@v4
        if: always() && steps.check-feeds.outputs.needs_rebuild == 'true'
        with:
          path: |
            cache/
            !cache/sha1/
          key: ${{ runner.os }}-downloads-${{ github.run_id }}

      # ── Tests ──────────────────────────────────────────────────────────────
      # Property tests for the router across a 3-city matrix. Each city runs
      # in its own cargo process so a failure clearly identifies the offending
      # fixture.
      - name: Run router tests (chicago)
        run: make test TEST_CITY=chicago
      - name: Run router tests (hong_kong)
        run: make test TEST_CITY=hong_kong
      - name: Run router tests (paris)
        run: make test TEST_CITY=paris

      # ── WASM (PGO-optimized) ───────────────────────────────────────────────
      # `make wasm` trains a native profile against chicago.bin (built above)
      # and then builds WASM with -Cprofile-use. Cache key includes Makefile
      # and scripts/pgo-train.sh because the build behavior depends on both.
      - name: Cache WASM output
        uses: actions/cache@v4
        id: wasm-cache
        with:
          path: transit-viz/pkg/
          key: ${{ runner.os }}-wasm-${{ hashFiles('transit-router/src/**', 'transit-router/Cargo.toml', 'transit-router-wasm/src/**', 'transit-router-wasm/Cargo.toml', 'transit-data/src/**', 'transit-data/Cargo.toml', '.cargo/config.toml', 'Makefile', 'scripts/pgo-train.sh') }}

      - name: Build WASM
        if: steps.wasm-cache.outputs.cache-hit != 'true'
        run: make wasm

      # ── Frontend ───────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: transit-viz/package-lock.json

      - name: Install npm dependencies
        working-directory: transit-viz
        run: npm ci

      - name: Build site
        working-directory: transit-viz
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy transit-viz/dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT_NAME }}
