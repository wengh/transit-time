[package]
name = "transit-router-wasm"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
transit-router = { path = "../transit-router" }
transit-data = { path = "../transit-data" }
serde = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }
wasm-bindgen-rayon = "1.2"
console_error_panic_hook = "0.1.7"
