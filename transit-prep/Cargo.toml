[package]
name = "transit-prep"
version = "0.1.0"
edition = "2024"

[lib]
name = "transit_prep"
path = "src/lib.rs"

[[bin]]
name = "transit-prep"
path = "src/main.rs"

[dependencies]
serde = { workspace = true }
zip = "2"
csv = "1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
quick-xml = "0.36"
osmpbf = "0.3"
flate2 = "1"
pco = "1"
chrono = "0.4"
rayon = "1"
